<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Connections / Wires -->
  <!-- VCC Line -->
  <line x1="200" y1="30" x2="200" y2="80" stroke="black" stroke-width="2"/>
  
  <!-- R1 (Divider Top) -->
  <line x1="200" y1="80" x2="200" y2="130" stroke="black" stroke-width="2"/>
  <rect x="185" y="130" width="30" height="60" fill="white" stroke="black" stroke-width="2"/>
  <path d="M200 130 l-8 10 l16 10 l-16 10 l16 10 l-16 10 l16 10 l-8 10" fill="none" stroke="black" stroke-width="2"/>
  <line x1="200" y1="190" x2="200" y2="240" stroke="black" stroke-width="2"/>

  <!-- Node to R2 & Base -->
  <circle cx="200" cy="240" r="3" fill="black"/>
  <line x1="200" y1="240" x2="150" y2="240" stroke="black" stroke-width="2"/>
  
  <!-- R2 (Divider Bottom) -->
  <line x1="200" y1="240" x2="200" y2="270" stroke="black" stroke-width="2"/>
  <path d="M200 270 l-8 10 l16 10 l-16 10 l16 10 l-16 10 l16 10 l-8 10" fill="none" stroke="black" stroke-width="2"/>
  <line x1="200" y1="330" x2="200" y2="370" stroke="black" stroke-width="2"/>
  <!-- Ground symbol -->
  <line x1="185" y1="370" x2="215" y2="370" stroke="black" stroke-width="2"/>
  <line x1="192" y1="375" x2="208" y2="375" stroke="black" stroke-width="2"/>
  <line x1="197" y1="380" x2="203" y2="380" stroke="black" stroke-width="2"/>

  <!-- RC (Collector Resistor) -->
  <line x1="200" y1="80" x2="280" y2="80" stroke="black" stroke-width="2"/>
  <line x1="280" y1="80" x2="280" y2="130" stroke="black" stroke-width="2"/>
  <path d="M280 130 l-8 10 l16 10 l-16 10 l16 10 l-16 10 l16 10 l-8 10" fill="none" stroke="black" stroke-width="2"/>
  <line x1="280" y1="190" x2="280" y2="230" stroke="black" stroke-width="2"/>

  <!-- Transistor (NPN) -->
  <!-- Base terminal -->
  <line x1="150" y1="240" x2="210" y2="240" stroke="black" stroke-width="2"/>
  <!-- Transistor body circle -->
  <circle cx="230" cy="250" r="35" fill="none" stroke="black" stroke-width="2"/>
  <!-- Base vertical bar -->
  <line x1="210" y1="230" x2="210" y2="270" stroke="black" stroke-width="4"/>
  <!-- Collector line -->
  <line x1="210" y1="240" x2="250" y2="210" stroke="black" stroke-width="2"/>
  <line x1="250" y1="210" x2="280" y2="210" stroke="black" stroke-width="2"/>
  <!-- Emitter line with arrow -->
  <line x1="210" y1="260" x2="250" y2="290" stroke="black" stroke-width="2"/>
  <path d="M 238 281 l 12 9 l -4 -13 z" fill="black"/>
  <line x1="250" y1="290" x2="250" y2="340" stroke="black" stroke-width="2"/>

  <!-- RE (Emitter Resistor) -->
  <path d="M250 340 l-10 8 l20 8 l-20 8 l20 8 l-20 8 l20 8 l-10 8" fill="none" stroke="black" stroke-width="2"/>
  <line x1="250" y1="388" x2="250" y2="410" stroke="black" stroke-width="2"/>
  <!-- Ground symbol -->
  <line x1="235" y1="410" x2="265" y2="410" stroke="black" stroke-width="2"/>
  <line x1="242" y1="415" x2="258" y2="415" stroke="black" stroke-width="2"/>
  <line x1="247" y1="420" x2="253" y2="420" stroke="black" stroke-width="2"/>

  <!-- Labels -->
  <text x="210" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="black">VCC</text>
  <text x="220" y="165" font-family="Arial" font-size="14" fill="black">R1</text>
  <text x="220" y="300" font-family="Arial" font-size="14" fill="black">R2</text>
  <text x="295" y="165" font-family="Arial" font-size="14" fill="black">RC</text>
  <text x="265" y="365" font-family="Arial" font-size="14" fill="black">RE</text>
  <text x="180" y="235" font-family="Arial" font-size="14" fill="black">Beta</text>
</svg>
